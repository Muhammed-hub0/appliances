name: تحديث أسعار الأجهزة المنزلية

on:
  schedule:
    # كل 6 ساعات بتوقيت UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      render_only:
        description: 'إعادة بناء الصفحات من البيانات الحالية بدون API'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: appliances-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: تجهيز Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تحديث الأسعار وبناء الصفحات
        env:
          CREATORS_CLIENT_ID: ${{ secrets.CREATORS_CLIENT_ID }}
          CREATORS_CLIENT_SECRET: ${{ secrets.CREATORS_CLIENT_SECRET }}
          PARTNER_TAG: ${{ vars.PARTNER_TAG || 'fineartslab-21' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://muhammed-hub0.github.io/appliances/' }}
        run: node scripts/update.mjs ${{ inputs.render_only && '--render-only' || '' }}

      # في تشغيل إعادة البناء من البيانات المحفوظة مفيش داعي لعمل كوميت أو push
      # (النشر بيحصل من الأرشيف)، وده بيمنع إيميلات فشل بسبب رفض تحديث المرجع.
      - name: حفظ البيانات المتغيرة
        id: save
        if: ${{ !inputs.render_only }}
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          # لو اتعمل كوميت يدوي أثناء التشغيل، ما نكتبش فوقه — النشر هيحصل في المرة الجاية.
          git fetch origin --quiet
          remote_head=$(git rev-parse "origin/${GITHUB_REF_NAME}")
          if [ "$remote_head" != "${GITHUB_SHA}" ]; then
            echo "concurrent=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Remote اتغير أثناء التشغيل — هنتخطى حفظ البيانات والنشر عشان ما نلغيش التعديلات اليدوية."
            exit 0
          fi
          git add data public
          if git diff --staged --quiet; then
            echo "مفيش تغييرات"
          else
            git commit -m "تحديث تلقائي للأسعار $(date -u +%Y-%m-%dT%H:%MZ)"
            pushed=0
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}" > /tmp/push.log 2>&1; then
                pushed=1
                break
              fi
              cat /tmp/push.log
              if grep -Eq 'fetch first|non-fast-forward' /tmp/push.log; then
                echo "concurrent=true" >> "$GITHUB_OUTPUT"
                echo "⚠️ Remote اتغير أثناء الـ push — هنتخطى النشر من غير فشل الخدمة."
                exit 0
              fi
              # جيت هاب بيرفض تحديث المرجع أحيانًا بخطأ داخلي مؤقت بدون سبب حقيقي.
              # بنجرّب تاني، ولو فضل رافض بنكمّل النشر من الأرشيف من غير إيميل فشل.
              if grep -q 'commit_refs_rules' /tmp/push.log; then
                if [ "$attempt" -lt 3 ]; then
                  echo "⚠️ رفض مؤقت لتحديث المرجع ($attempt/3) — هنتجرّب تاني بعد شوية."
                  sleep 20
                  git fetch origin --quiet
                  continue
                fi
                echo "save_soft=true" >> "$GITHUB_OUTPUT"
                echo "⚠️ جيت هاب لسه رافض تحديث المرجع بعد 3 محاولات — هينشر من الأرشيف من غير فشل التشغيل."
                exit 0
              fi
              exit 1
            done
            if [ "$pushed" -ne 1 ]; then
              echo "save_soft=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: تجهيز ملفات النشر
        if: steps.save.outputs.concurrent != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # ساعات بيطلع خطأ "No artifacts named github-pages" لأن deploy-pages بيسبق
      # ظهور الأرشيف في API جيت هاب. بنستنى لحد ما يظهر عشان مفيش إيميلات فشل.
      - name: انتظار ظهور أرشيف النشر
        if: steps.save.outputs.concurrent != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                --jq '.artifacts[] | select(.name == "github-pages") | .id' | grep -q .; then
              echo "أرشيف النشر جاهز"
              exit 0
            fi
            echo "لسه الأرشيف مش ظاهر... ($i/30)"
            sleep 10
          done
          echo "الأرشيف مش ظاهر بعد الانتظار"
          exit 1

      # حتى بعد ظهور الأرشيف، deploy-pages@v4 بيفشل أحيانًا في قراءته من API جيت هاب.
      # بنجرّب 3 مرات بفواصل زمنية عشان التعثر اللحظي ما يعملش Run failed وإيميل.
      - name: النشر على GitHub Pages (1/3)
        id: deploy1
        if: steps.save.outputs.concurrent != 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: استنى قبل المحاولة التانية
        if: steps.save.outputs.concurrent != 'true' && steps.deploy1.outcome != 'success'
        run: sleep 30

      - name: النشر على GitHub Pages (2/3)
        id: deploy2
        if: steps.save.outputs.concurrent != 'true' && steps.deploy1.outcome != 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: استنى قبل المحاولة التالتة
        if: steps.save.outputs.concurrent != 'true' && steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success'
        run: sleep 60

      - name: النشر على GitHub Pages (3/3)
        if: steps.save.outputs.concurrent != 'true' && steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success'
        uses: actions/deploy-pages@v4
