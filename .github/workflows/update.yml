name: تحديث أسعار الأجهزة المنزلية

on:
  schedule:
    # كل 6 ساعات بتوقيت UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      render_only:
        description: 'إعادة بناء الصفحات من البيانات الحالية بدون API'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: appliances-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: تجهيز Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تحديث الأسعار وبناء الصفحات
        env:
          CREATORS_CLIENT_ID: ${{ secrets.CREATORS_CLIENT_ID }}
          CREATORS_CLIENT_SECRET: ${{ secrets.CREATORS_CLIENT_SECRET }}
          PARTNER_TAG: ${{ vars.PARTNER_TAG || 'fineartslab-21' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://muhammed-hub0.github.io/appliances/' }}
        run: node scripts/update.mjs ${{ inputs.render_only && '--render-only' || '' }}

      - name: حفظ البيانات المتغيرة
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data public
          if git diff --staged --quiet; then
            echo "مفيش تغييرات"
          else
            git commit -m "تحديث تلقائي للأسعار $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: تجهيز ملفات النشر
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # ساعات بيطلع خطأ "No artifacts named github-pages" لأن deploy-pages بيسبق
      # ظهور الأرشيف في API جيت هاب. بنستنى لحد ما يظهر عشان مفيش إيميلات فشل.
      - name: انتظار ظهور أرشيف النشر
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                --jq '.artifacts[] | select(.name == "github-pages") | .id' | grep -q .; then
              echo "أرشيف النشر جاهز"
              exit 0
            fi
            echo "لسه الأرشيف مش ظاهر... ($i/30)"
            sleep 10
          done
          echo "الأرشيف مش ظاهر بعد الانتظار"
          exit 1

      # حتى بعد ظهور الأرشيف، deploy-pages@v4 بيفشل أحيانًا في قراءته من API جيت هاب.
      # بنجرّب 3 مرات بفواصل زمنية عشان التعثر اللحظي ما يعملش Run failed وإيميل.
      - name: النشر على GitHub Pages (1/3)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: استنى قبل المحاولة التانية
        if: steps.deploy1.outcome != 'success'
        run: sleep 30

      - name: النشر على GitHub Pages (2/3)
        id: deploy2
        if: steps.deploy1.outcome != 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: استنى قبل المحاولة التالتة
        if: steps.deploy2.outcome != 'success'
        run: sleep 60

      - name: النشر على GitHub Pages (3/3)
        if: steps.deploy2.outcome != 'success'
        uses: actions/deploy-pages@v4
